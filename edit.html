<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Edit Club — AUM</title>
<style>
  :root{--bg:#071421;--muted:#9aa4b2;--accent:#7c3aed}
  body{margin:0;font-family:Inter,system-ui,Arial;color:#eaf6ff;background:linear-gradient(180deg,#071421,#071827);min-height:100vh}
  .wrap{max-width:820px;margin:28px auto;padding:20px}
  a.back{color:#9ad7ff;text-decoration:none;font-weight:700}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
  .row{display:flex;gap:12px}
  .col{flex:1}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .btn{padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
  .btn.primary{background:linear-gradient(90deg,#7c3aed,#3b82f6);color:white}
  .img-preview{width:140px;height:92px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,0.04)}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; Back</a>
    <h2 style="margin:8px 0 6px 0">Edit Club</h2>

    <div class="card">
      <form id="editForm">
        <input type="hidden" id="clubId" />
        <div>
          <label for="name">Club name</label>
          <input id="name" required />
        </div>

        <div class="row" style="margin-top:10px">
          <div class="col">
            <label for="category">Category</label>
            <select id="category">
              <option>Academic</option><option>Sports</option><option>Cultural</option><option>Service</option><option>Tech</option>
            </select>
          </div>
          <div class="col">
            <label for="contact">Contact</label>
            <input id="contact" />
          </div>
        </div>

        <div style="margin-top:10px">
          <label for="tags">Tags (comma separated)</label>
          <input id="tags" />
        </div>

        <div style="margin-top:10px">
          <label for="desc">Short description</label>
          <textarea id="desc" rows="4"></textarea>
        </div>

        <div style="margin-top:10px">
          <label>Club image / logo (optional)</label>
          <div style="display:flex;gap:12px;align-items:center">
            <input id="imageFile" type="file" accept="image/*" />
            <img id="previewImg" class="img-preview" alt="preview" />
          </div>
          <div class="muted" style="margin-top:8px">Uploading replaces existing image. Leave empty to keep current.</div>
        </div>

        <div class="actions">
          <a href="index.html" class="btn" style="background:transparent;border:1px solid rgba(255,255,255,0.04);color:#9ad7ff;padding:8px 12px;border-radius:8px;text-decoration:none">Cancel</a>
          <button class="btn primary" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

<script src="script.js"></script>
<script>
  function qParam(name){ return (new URLSearchParams(location.search)).get(name); }
  
  (function(){
    const name = sessionStorage.getItem('aum_user_name');
    const sid  = sessionStorage.getItem('aum_user_id');
  })();

  seedClubs();
  const id = qParam('id');
  if(!id){ alert('No club id'); location.href='index.html'; }

  const clubs = getClubs() || [];
  const club = clubs.find(c => c.id === id);
  if(!club){ alert('Club not found'); location.href='index.html'; }

  document.getElementById('clubId').value = club.id;
  document.getElementById('name').value = club.name || '';
  document.getElementById('category').value = club.category || 'Academic';
  document.getElementById('contact').value = club.contact || '';
  document.getElementById('tags').value = (club.tags||[]).join(',');
  document.getElementById('desc').value = club.description || '';
  const previewImg = document.getElementById('previewImg');
  previewImg.src = club.image ? club.image : generatePlaceholderDataUrl(club.name, club.category);

  document.getElementById('imageFile').addEventListener('change', (ev)=>{
    const f = ev.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = e => { previewImg.src = e.target.result; };
    r.readAsDataURL(f);
  });

  document.getElementById('editForm').addEventListener('submit', (ev)=>{
    ev.preventDefault();
    const name = document.getElementById('name').value.trim(); if(!name) return alert('Name required');
    const category = document.getElementById('category').value;
    const contact = document.getElementById('contact').value.trim();
    const tags = document.getElementById('tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const desc = document.getElementById('desc').value.trim();
    const file = document.getElementById('imageFile').files[0];

    if(file){
      const r = new FileReader();
      r.onload = e => { saveUpdated(e.target.result); };
      r.readAsDataURL(file);
    } else {
      saveUpdated(club.image || generatePlaceholderDataUrl(name, category));
    }

    function saveUpdated(imageData){
      const all = getClubs();
      const updated = all.map(c => c.id === id ? Object.assign({}, c, { name, category, contact, tags, description: desc, image: imageData }) : c);
      setClubs(updated);
      alert('Saved');
      location.href = 'index.html';
    }
  });
</script>
</body>
</html>
